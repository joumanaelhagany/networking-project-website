<!DOCTYPE html>
<html>
<head>
  <title>Feedback</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f8fb;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 80%;
      max-width: 800px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
      color: #1b4965;
    }

    p {
      line-height: 1.6;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      background-color: #1b4965;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 16px;
    }

    button:hover {
      background-color: #16394f;
    }

    a {
      color: #1b4965;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
    }

    .network-image {
      width: 100%;
      max-width: 500px;
      display: block;
      margin: 20px 0;
      border-radius: 8px;
    }

    #output {
      margin-top: 20px;
      padding: 15px;
      background-color: #eef6fb;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <a class="nav-link" href="index.html">← Back to Home</a>

    <h1>Website Feedback</h1>

    <img src="network-diagram.png.png" alt="Network Diagram" loading="lazy" class="network-image">

    <form id="feedbackForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name">

      <label for="topic">Favorite Networking Topic:</label>
      <input type="text" id="topic" name="topic">

      <label for="comment">Comment:</label>
      <textarea id="comment" name="comment" rows="5"></textarea>

      <button type="submit">Submit</button>
    </form>

    <h2>Submitted Feedback</h2>
    <div id="output"></div>
  </div>

  <script>
    const form = document.getElementById("feedbackForm");
    const output = document.getElementById("output");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const topic = document.getElementById("topic").value.trim();
      const comment = document.getElementById("comment").value.trim();

      if (name === "" || topic === "" || comment === "") {
        alert("Please fill in all fields.");
        output.innerHTML = "";
        return;
      }

      output.innerHTML = "";

      const namePara = document.createElement("p");
      namePara.textContent = "Name: " + name;

      const topicPara = document.createElement("p");
      topicPara.textContent = "Favorite Topic: " + topic;

      const commentPara = document.createElement("p");
      commentPara.textContent = "Comment: " + comment;

      output.appendChild(namePara);
      output.appendChild(topicPara);
      output.appendChild(commentPara);
    });
  </script>
</body>
</html>
