<!DOCTYPE html>
<html>
<head>
  <title>Feedback</title>
</head>

<body>
  <h1>Website Feedback</h1>
  <img src="https://upload.wikimedia.org/wikipedia/commons/7/70/Computer_Network_Diagram.png" alt="Network Diagram" loading="lazy" width="100%" style="max-width: 500px; display: block; margin-bottom: 20px; border-radius: 8px;">

  <form id="feedbackForm">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name"><br><br>

    <label for="topic">Favorite Networking Topic:</label><br>
    <input type="text" id="topic" name="topic"><br><br>

    <label for="comment">Comment:</label><br>
    <textarea id="comment" name="comment" rows="5" cols="30"></textarea><br><br>

    <button type="submit">Submit</button>
  </form>

  <h2>Submitted Feedback</h2>
  <div id="output"></div>

  <script>
    const form = document.getElementById("feedbackForm");
    const output = document.getElementById("output");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const topic = document.getElementById("topic").value.trim();
      const comment = document.getElementById("comment").value.trim();

      if (name === "" || topic === "" || comment === "") {
        alert("Please fill in all fields.");
        output.innerHTML = "";
        return;
      }

      output.innerHTML = "";

      const namePara = document.createElement("p");
      namePara.textContent = "Name: " + name;

      const topicPara = document.createElement("p");
      topicPara.textContent = "Favorite Topic: " + topic;

      const commentPara = document.createElement("p");
      commentPara.textContent = "Comment: " + comment;

      output.appendChild(namePara);
      output.appendChild(topicPara);
      output.appendChild(commentPara);
    });
  </script>
</body>
</html>
